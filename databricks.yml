bundle:
  name: nflcombine

include:
  - resources/*.yml

artifacts:
  nflcombine_wheel:
    type: whl
    build: python -m pip wheel --no-deps --wheel-dir dist .
    path: .

variables:
  catalog:
    description: Unity Catalog catalog holding bronze/silver/gold schemas
    default: kaggle-nfl
  raw_dir:
    description: UC Volume path with the raw Kaggle CSVs
    default: /Volumes/kaggle-nfl/bronze/raw_data

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      catalog: kaggle-nfl
