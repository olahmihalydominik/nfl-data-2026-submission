[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nflcombine"
version = "0.1.0"
description = "NFL Big Data Bowl 2027: combine tracking -> NFL performance (medallion pipeline + analysis)"
readme = "README.md"
# Databricks serverless / DBR 15.4+ run Python 3.12. Develop on 3.12 locally to match.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Provided by the Databricks runtime; install locally only if you want to run Spark code on your machine.
spark = ["pyspark>=3.5,<4.1"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
# Entry point used by the Databricks job (python_wheel_task) and locally: `nflcombine --task bronze`
nflcombine = "nflcombine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nflcombine"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the YAML config inside the wheel so jobs read exactly the config they were built with.
"conf" = "nflcombine/_conf"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "todo: contract test for code not implemented yet (skipped unless --run-todo)",
    "data: needs the raw Kaggle CSVs locally (skipped unless NFL_RAW_DIR points at them)",
]
