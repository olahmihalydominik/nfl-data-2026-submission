# Raw combine drill -> canonical drill. Spec: .ignored_plans/SILVER_GOLD_PLAN.md §2.2
#
# Key = (drill_type, drill_name) because the same drill_name can mean different things per position
# (e.g. GAUNTLET_DRILL for DB vs WR/TE). All 62 (drill_type, drill_name) pairs in combine_tracking.csv
# must be listed; silver_combine fails on an unknown pair.
#
# Fields
#   canonical : merged name. Only spelling variants are merged, never different drills.
#   family    : drives which feature extractors run (see features/combine_drills.py)
#   side      : LEFT / RIGHT if encoded in the name, NONE otherwise. LEFT drills are mirrored in silver.
#   mixed_side: true if the drill is run to both sides without the name saying so -> infer side per attempt
#   variant   : sub-variant kept as a column when several raw drills pool into one canonical
#   verify    : semantics not yet confirmed by animation (Phase 2). Features are provisional until false.
#
# position_group is derived from drill_type (SKILL_DRILLS_<GROUP>), ALL for the three general tests.
# "analysable" is NOT hard-coded: computed at runtime as n_players >= combine.min_players_analysable.

families: [LINEAR_SPRINT, COD_AGILITY, BACKPEDAL_BREAK, LATERAL_SHUFFLE, LATERAL_REACTION,
           LATERAL_RUN_CATCH, PASS_RUSH, PASS_SET, PULL, RELEASE_SPRINT, BURST, ROUTE, BALL_SKILL]

drills:
  # ---- general tests ----------------------------------------------------------------------------
  - {drill_type: FORTY_YARD_DASH,  drill_name: FORTY_YARD_DASH,  canonical: FORTY,         family: LINEAR_SPRINT, side: NONE}
  - {drill_type: SHORT_SHUTTLE,    drill_name: SHORT_SHUTTLE,    canonical: SHORT_SHUTTLE, family: COD_AGILITY,   side: NONE}
  - {drill_type: THREE_CONE_DRILL, drill_name: THREE_CONE_DRILL, canonical: THREE_CONE,    family: COD_AGILITY,   side: NONE}

  # ---- DB -------------------------------------------------------------------------------------------
  - {drill_type: SKILL_DRILLS_DB, drill_name: BACK_PEDAL_AND_90_DEGREE_BREAK_TO_BALL,       canonical: DB_BACKPEDAL_90_BREAK,      family: BACKPEDAL_BREAK,   side: NONE}
  - {drill_type: SKILL_DRILLS_DB, drill_name: BACK_PEDAL_AND_TRANSITION_45_DEGREE_REACTION, canonical: DB_BACKPEDAL_45_TRANSITION, family: BACKPEDAL_BREAK,   side: NONE, mixed_side: true}
  - {drill_type: SKILL_DRILLS_DB, drill_name: BOX_DRILL,                                    canonical: DB_BOX,                     family: COD_AGILITY,       side: NONE}
  - {drill_type: SKILL_DRILLS_DB, drill_name: GAUNTLET_DRILL,                               canonical: DB_GAUNTLET,                family: LATERAL_RUN_CATCH, side: NONE}
  - {drill_type: SKILL_DRILLS_DB, drill_name: LINE,                                         canonical: DB_LINE,                    family: BACKPEDAL_BREAK,   side: NONE, verify: true}
  - {drill_type: SKILL_DRILLS_DB, drill_name: LINE_DRILL,                                   canonical: DB_LINE,                    family: BACKPEDAL_BREAK,   side: NONE, verify: true}
